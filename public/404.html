<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Révisions MIPI L2</title>
<style>
  :root { --bg: #0b0d14; --surface: #12141f; --border: #2a2e45; --text: #e8eaf2; --muted: #a0a7c0; --accent: #6c63ff; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; box-sizing: border-box; }
  .box { max-width: 420px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 24px; }
  h1 { font-size: 22px; margin: 8px 0; }
  p { color: var(--muted); }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:40px;font-weight:800;color:#b3abff">404</div>
    <h1>Page introuvable</h1>
    <p>Ce fichier n'existe pas sur le site. Vérifie le lien ou repars de l'accueil.</p>
    <a href="/">Retour aux révisions</a>
  </div>
</body>
</html>
