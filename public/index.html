<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Révisions MIPI L2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236c63ff'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0d14;
    --surface: #12141f;
    --surface-2: #1a1d2c;
    --surface-3: #232739;
    --border: #2a2e45;
    --text: #e8eaf2;
    --muted: #a0a7c0;
    --accent: #6c63ff;
    --accent-hover: #7f77ff;
    --accent-text: #b3abff;
    --accent-soft: rgba(108, 99, 255, 0.16);
    --ok: #4ade80;
    --ok-soft: rgba(74, 222, 128, 0.13);
    --bad: #f87171;
    --bad-soft: rgba(248, 113, 113, 0.13);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --nav-h: 60px;
    --tabbar-h: 64px;
    --gutter: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;              /* le conteneur #page gère le défilement */
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent-text); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 6px; }
  code { font-family: var(--mono); font-size: 0.92em; background: var(--surface-3); padding: 1px 5px; border-radius: 5px; }
  [hidden] { display: none !important; }
  .name-short { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------------- barre du haut ---------------- */
  .topnav {
    flex-shrink: 0; height: var(--nav-h);
    display: flex; justify-content: center;
    background: rgba(11, 13, 20, 0.92);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    padding-top: env(safe-area-inset-top);
    z-index: 30;
  }
  .topnav-inner { width: 100%; max-width: 1180px; display: flex; align-items: center; gap: 18px; min-width: 0; }
  .logo { font-weight: 700; font-size: 16px; letter-spacing: .2px; color: var(--text); text-decoration: none; white-space: nowrap; }
  .logo span { color: var(--accent-text); }
  .navlinks { display: flex; gap: 4px; }
  .navlink {
    display: inline-flex; align-items: center; min-height: 40px;
    padding: 0 14px; border-radius: 999px;
    color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .navlink:hover { color: var(--text); background: var(--surface-2); }
  .navlink[aria-current="page"] { color: #fff; background: var(--accent); }

  /* ---------------- barre d'onglets mobile ---------------- */
  .tabbar { display: none; }

  /* ---------------- zone principale ---------------- */
  main#page { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; outline: none; scroll-behavior: smooth; }
  .page-inner { max-width: 1120px; margin: 0 auto; padding: 28px var(--gutter) 72px; }
  main#page.flush { overflow: hidden; display: flex; }
  main#page.flush .page-inner { max-width: none; margin: 0; padding: 0; width: 100%; display: flex; min-height: 0; }
  .view-enter { animation: viewIn .18s ease-out; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 19px; margin: 0 0 10px; }
  h3 { font-size: 16px; margin: 0 0 8px; }
  .lead { color: var(--muted); max-width: 640px; margin: 0 0 22px; }
  .eyebrow { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: 1.2px; margin: 0 0 6px; }
  .section-title { font-size: 12.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 32px 0 12px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---------------- boutons ---------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 18px; border-radius: 10px;
    border: 1px solid transparent; background: var(--accent); color: #fff;
    font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.secondary { background: var(--surface-2); border-color: var(--border); color: var(--text); }
  .btn.secondary:hover { border-color: var(--accent-text); }
  .btn.ghost { background: none; border-color: var(--border); color: var(--muted); }
  .btn.ghost:hover { color: var(--text); border-color: var(--accent-text); }
  .btn.ok { background: var(--ok-soft); border-color: rgba(74,222,128,.45); color: var(--ok); }
  .btn.warn { background: var(--warn-soft); border-color: rgba(251,191,36,.45); color: var(--warn); }
  .btn.pill { border-radius: 999px; }
  .btn[aria-pressed="true"].ok { background: var(--ok); color: #06210f; }
  .btn[aria-pressed="true"].warn { background: var(--warn); color: #2a1d00; }
  .icon-btn {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-2); border: 1px solid var(--border); font-size: 18px; line-height: 1;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .icon-btn:hover { border-color: var(--warn); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn[aria-expanded="true"] { border-color: var(--warn); background: var(--warn-soft); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; color: var(--accent-text); text-decoration: none; font-size: 14px; margin-bottom: 8px; }
  .back-link:hover { text-decoration: underline; }

  /* ---------------- cartes ---------------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  a.card, button.card { display: block; color: inherit; text-decoration: none; text-align: left; width: 100%; transition: border-color .15s, transform .15s; }
  a.card:hover, button.card:hover { border-color: var(--accent-text); transform: translateY(-2px); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.accent { background: var(--accent-soft); color: var(--accent-text); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .progress { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
  .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
  .progress.ok > span { background: var(--ok); }

  .matiere-card { display: flex; flex-direction: column; gap: 10px; }
  .matiere-card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .matiere-card h3 { margin: 0; font-size: 17px; }
  .stat-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
  .stat-line b { color: var(--text); font-weight: 600; }

  .notice { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13.5px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); }
  .notice.warn { border-color: rgba(251,191,36,.35); background: var(--warn-soft); color: #f5d98a; }
  .notice.ok { border-color: rgba(74,222,128,.35); background: var(--ok-soft); color: #a7f0c2; }
  .notice.bad { border-color: rgba(248,113,113,.35); background: var(--bad-soft); color: #fbb4b4; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  .empty h2 { color: var(--text); }

  /* ---------------- onglets (liens) ---------------- */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 20px; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-current="page"] { color: #fff; background: var(--accent-soft); border-color: var(--accent); }
  .tab .count { font-size: 12px; opacity: .8; }

  /* ---------------- Cours ---------------- */
  .cours-layout { display: flex; width: 100%; min-height: 0; }
  .doc-sidebar { width: 300px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding-bottom: 24px; }
  .acc-head {
    width: 100%; display: flex; align-items: center; gap: 10px; justify-content: space-between;
    min-height: 52px; padding: 0 18px; background: none; border: none; text-align: left;
    font-weight: 700; font-size: 14.5px;
  }
  .acc-head:hover { background: var(--surface-2); }
  .acc-head .chev { color: var(--muted); transition: transform .2s; font-size: 12px; }
  .acc-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .acc-body[hidden] { display: none; }
  .doc-group-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); padding: 12px 18px 4px; }
  .doc-link {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 40px; padding: 6px 18px 6px 28px; color: var(--muted); text-decoration: none; font-size: 14px;
  }
  .doc-link:hover { color: var(--text); background: var(--surface-2); }
  .doc-link[aria-current="page"] { color: #fff; background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .viewer { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .viewer-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; min-height: 60px; }
  .viewer-bar .title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .viewer-frame { flex: 1; min-height: 0; background: #1a1c24; }
  .viewer-frame iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .doc-list .acc { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; margin-bottom: 12px; }
  .doc-list .doc-link { padding-left: 18px; min-height: 48px; border-top: 1px solid var(--border); }
  .doc-list .doc-group-label { border-top: 1px solid var(--border); padding-top: 14px; }

  /* ---------------- Annales ---------------- */
  .acc-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 12px; overflow: hidden; }
  .acc-card > .acc-head { min-height: 58px; }
  .acc-card > .acc-body { padding: 0 16px 16px; }
  .annale { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 12px; }
  .annale-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .annale h3 { margin: 0 0 2px; }
  .annale .meta { margin: 0; font-size: 13px; color: var(--muted); }
  .annale .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .annale .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .annale .note { font-size: 12.5px; color: var(--muted); font-style: italic; margin: 10px 0 0; }

  pre.block {
    margin: 12px 0 0; background: #0d0f16; border: 1px solid var(--border); border-left: 3px solid var(--accent-text);
    border-radius: var(--radius-sm); padding: 12px 14px; font: 13px/1.55 var(--mono); color: #d6d9e3;
    white-space: pre; overflow-x: auto; max-width: 100%; tab-size: 4;
  }
  pre.block.solution { border-left-color: var(--ok); }
  .longtext {
    margin: 12px 0 0; background: #0d0f16; border: 1px solid var(--border); border-left: 3px solid var(--accent-text);
    border-radius: var(--radius-sm); padding: 12px 14px; font: 13px/1.55 var(--mono); color: #d6d9e3; max-width: 100%;
  }
  .longtext.solution { border-left-color: var(--ok); }
  .longtext > * { margin: 0 0 12px; font: inherit; }
  .longtext > :last-child { margin-bottom: 0; }
  .longtext .part-code { white-space: pre; overflow-x: auto; tab-size: 4; }
  .longtext .part-prose { white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.block.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* ---------------- Révision : chapitres ---------------- */
  .chapter-card { display: flex; flex-direction: column; gap: 10px; }
  .chapter-card .ctitle { font-weight: 700; font-size: 15px; }
  .chapter-card .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chapter-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; }

  /* ---------------- Fiche ---------------- */
  .fiche { max-width: 820px; }
  .fiche-sources { font-size: 13.5px; }
  .fiche-sources ul { margin: 6px 0 0; padding-left: 18px; }
  .fiche-section { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; margin-top: 14px; }
  .fiche-section h3 { display: flex; align-items: center; gap: 8px; }
  .fiche-section ul { margin: 0; padding-left: 20px; }
  .fiche-section li { margin: 6px 0; }
  .fiche-section.def { border-left: 3px solid var(--accent); }
  .fiche-section.key { border-left: 3px solid #5ab0ff; }
  .fiche-section.method { border-left: 3px solid #c48cff; }
  .fiche-section.code { border-left: 3px solid var(--muted); }
  .fiche-section.pitfall { border-left: 3px solid var(--bad); }
  .fiche-section.exam { border-left: 3px solid var(--warn); background: linear-gradient(0deg, var(--warn-soft), var(--warn-soft)), var(--surface); }
  .fiche-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

  /* ---------------- exercices / quiz ---------------- */
  .runner { max-width: 780px; }
  .runner-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
  .runner .progress { margin-bottom: 16px; }
  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .q-title { font-size: 16.5px; font-weight: 700; margin: 0; line-height: 1.4; }
  .q-type { font-size: 12.5px; color: var(--muted); margin: 2px 0 12px; }
  .statement { white-space: pre-wrap; overflow-wrap: anywhere; color: #cdd2e2; margin: 0 0 14px; }
  .statement.code-like { font: 13px/1.55 var(--mono); background: #0d0f16; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; white-space: pre; overflow-x: auto; }
  .hint-box { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); border: 1px solid rgba(251,191,36,.35); color: #f5d98a; border-radius: var(--radius-sm); padding: 10px 12px; margin: 0 0 14px; }
  .hint-box[hidden] { display: none; }
  .hint-box p { margin: 0; flex: 1; }
  .hint-box .close { background: none; border: none; color: inherit; font-size: 18px; min-width: 32px; min-height: 32px; line-height: 1; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea.answer {
    width: 100%; min-height: 110px; resize: vertical;
    background: #0d0f16; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; font: 13.5px/1.5 var(--mono); color: var(--text);
  }
  textarea.answer:focus { border-color: var(--accent-text); outline: none; }
  .saved-flag { font-size: 12px; color: var(--muted); min-height: 18px; margin: 4px 0 10px; }
  .self-eval { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .self-eval > span { flex-basis: 100%; }
  .self-eval .btn { flex: 1 1 140px; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .nav-row .btn { flex: 1 1 140px; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
  .step {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .step.current { border-color: var(--accent-text); color: #fff; }
  .step.ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(74,222,128,.4); }
  .step.review { background: var(--warn-soft); color: var(--warn); border-color: rgba(251,191,36,.4); }
  .step.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(248,113,113,.4); }

  .option {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
    min-height: 48px; padding: 12px 14px; margin-bottom: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text);
    transition: border-color .12s, background .12s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent-text); }
  .option .mark { flex-shrink: 0; width: 20px; height: 20px; margin-top: 1px; border: 2px solid var(--muted); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .option.multi .mark { border-radius: 5px; }
  .option[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .option[aria-checked="true"] .mark { border-color: var(--accent-text); background: var(--accent); color: #fff; }
  .option.correct { border-color: var(--ok); background: var(--ok-soft); }
  .option.correct .mark { border-color: var(--ok); background: var(--ok); color: #06210f; }
  .option.incorrect { border-color: var(--bad); background: var(--bad-soft); }
  .option.incorrect .mark { border-color: var(--bad); background: var(--bad); color: #2b0606; }
  .option:disabled { cursor: default; }
  .feedback { margin-top: 12px; }
  .feedback strong { display: block; margin-bottom: 4px; }

  .result-hero { text-align: center; padding: 26px 16px; }
  .result-hero .big { font-size: 40px; font-weight: 800; line-height: 1.1; }
  .review-item { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--surface); }
  .review-item p { margin: 4px 0; }

  /* ---------------- Partiels ---------------- */
  .switch { display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 46px; height: 26px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border); position: relative; transition: background .15s; flex-shrink: 0; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(20px); background: #fff; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  .timer-bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(18, 20, 31, 0.96); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 16px; margin-bottom: 16px;
  }
  .timer-bar .time { font: 700 22px/1 var(--mono); }
  .timer-bar.low .time { color: var(--warn); }
  .timer-bar.over { border-color: var(--bad); }
  .timer-bar.over .time { color: var(--bad); }

  /* ---------------- toast ---------------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--surface-3); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 460px);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------------- responsive ---------------- */
  @media (max-width: 1024px) {
    .doc-sidebar { width: 250px; }
  }
  @media (max-width: 760px) {
    :root { --nav-h: 54px; --gutter: 16px; }
    body { font-size: 15.5px; }
    .navlinks { display: none; }
    .topnav-inner { justify-content: center; }
    .tabbar {
